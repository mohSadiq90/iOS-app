name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint and capture output
        run: |
          swiftlint lint --quiet --reporter json > swiftlint_results.json || true

      - name: Post SwiftLint violations as PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const postSwiftLint = require('./.github/scripts/post-swiftlint-comment.js');
            await postSwiftLint({ github, context });

      - name: Post inline review comments (Native)
        run: swiftlint lint --quiet --reporter github-actions-logging || true

  module-tests:
    name: Module Tests — ${{ matrix.module }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - module: NetworkUtility
            scheme: NetworkUtility
          - module: CommonUI
            scheme: CommonUI
          - module: LocalStorage
            scheme: LocalStorage
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate ${{ matrix.module }} Xcode project
        run: |
          cd Modules/${{ matrix.module }}
          xcodegen generate

      - name: Run ${{ matrix.module }} tests
        run: |
          xcodebuild test \
            -project Modules/${{ matrix.module }}/${{ matrix.module }}.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -enableCodeCoverage YES \
            | xcpretty || xcodebuild test \
            -project Modules/${{ matrix.module }}/${{ matrix.module }}.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -enableCodeCoverage YES

  code-coverage:
    name: Code Coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build & Generate Coverage
        uses: ./.github/actions/build-and-test

      - name: Download Base Coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download -n base-coverage -D . || true

      - name: Post Coverage Comment
        uses: actions/github-script@v8
        with:
          script: |
            const postCoverage = require('./.github/scripts/post-coverage-comment.js');
            await postCoverage({ github, context });


