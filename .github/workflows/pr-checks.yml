name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint and capture output
        run: |
          swiftlint lint --quiet --reporter json > swiftlint_results.json || true

      - name: Post SwiftLint violations as PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const postSwiftLint = require('./.github/scripts/post-swiftlint-comment.js');
            await postSwiftLint({ github, context });

      - name: Post inline review comments (Native)
        run: swiftlint lint --quiet --reporter github-actions-logging || true

  module-tests:
    name: Module Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Detect available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          phones = [(rt, dev['udid']) for rt, devs in data['devices'].items() for dev in devs if 'iPhone' in dev['name'] and dev.get('isAvailable', False)]
          phones.sort(key=lambda x: x[0], reverse=True)
          print(phones[0][1] if phones else '')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run Module Tests
        run: |
          for MODULE in NetworkUtility CommonUI LocalStorage; do
            echo "=========================================="
            echo "      Running tests for $MODULE"
            echo "=========================================="
            cd "Modules/$MODULE"
            xcodegen generate
            
            if ! (xcodebuild test \
              -project "${MODULE}.xcodeproj" \
              -scheme "${MODULE}" \
              -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
              -enableCodeCoverage YES \
              | xcpretty); then
              echo "xcpretty pipe failed or tests failed, retrying with raw output..."
              xcodebuild test \
                -project "${MODULE}.xcodeproj" \
                -scheme "${MODULE}" \
                -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
                -enableCodeCoverage YES || exit 1
            fi
            
            cd ../..
          done

  code-coverage:
    name: Code Coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build & Generate Coverage
        uses: ./.github/actions/build-and-test

      - name: Download Base Coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download -n base-coverage -D . || true

      - name: Post Coverage Comment
        uses: actions/github-script@v8
        with:
          script: |
            const postCoverage = require('./.github/scripts/post-coverage-comment.js');
            await postCoverage({ github, context });


