name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint and capture output
        id: swiftlint
        run: |
          swiftlint lint --quiet --reporter json > swiftlint_results.json || true

      - name: Post SwiftLint violations as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('swiftlint_results.json', 'utf8'));

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes('FancyBot: SwiftLint Report') && c.user.type === 'Bot');

            const postOrUpdate = async (body) => {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            };

            if (results.length === 0) {
              await postOrUpdate('## 🤖 FancyBot: SwiftLint Report\n\n✅ **SwiftLint**: No violations found!');
              return;
            }

            // Group by severity
            const errors = results.filter(v => (v.severity || '').toLowerCase() === 'error');
            const warnings = results.filter(v => (v.severity || '').toLowerCase() === 'warning');

            let body = `## 🤖 FancyBot: SwiftLint Report\n\n`;
            body += `| Metric | Count |\n|--------|-------|\n`;
            body += `| 🔴 Errors | ${errors.length} |\n`;
            body += `| 🟡 Warnings | ${warnings.length} |\n\n`;

            const formatViolations = (violations, label) => {
              if (violations.length === 0) return '';
              let section = `### ${label}\n\n`;
              section += `| File | Line | Rule | Reason |\n|------|------|------|--------|\n`;
              for (const v of violations.slice(0, 50)) { // cap at 50
                const file = v.file.replace(process.env.GITHUB_WORKSPACE + '/', '');
                section += `| \`${file}\` | ${v.line} | \`${v.rule_id}\` | ${v.reason} |\n`;
              }
              if (violations.length > 50) section += `\n> ⚠️ Showing first 50 of ${violations.length} violations.\n`;
              return section + '\n';
            };

            body += formatViolations(errors, '🔴 Errors');
            body += formatViolations(warnings, '🟡 Warnings');

            await postOrUpdate(body);

      - name: Post inline review comments (Native)
        run: swiftlint lint --quiet --reporter github-actions-logging || true

  code-coverage:
    name: Code Coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build & Generate Coverage
        run: |
          # First, generate the project since it's not checked into Git
          brew install xcodegen
          xcodegen generate
          xcodebuild test \
            -project iOSApp.xcodeproj \
            -scheme "iOSApp" \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Download Base Coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download -n base-coverage -D . || true

      - name: Post Coverage Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // Parse xccov report
            let raw = '{}';
            try {
              raw = execSync(
                'xcrun xccov view --report --json TestResults.xcresult'
              ).toString();
            } catch (e) {
              console.log('Failed to parse xccov report');
              return;
            }
            const report = JSON.parse(raw);

            let baseReport = null;
            try {
              baseReport = JSON.parse(fs.readFileSync('base_coverage.json', 'utf8'));
            } catch (e) {}

            const totalCoverage = (report.lineCoverage * 100);
            const baseTotal = baseReport ? (baseReport.lineCoverage * 100) : null;
            
            const getDeltaStr = (current, base) => {
              if (base === null) return '';
              const diff = current - base;
              if (diff === 0) return ' (0.0%)';
              return diff > 0 ? ` (+${diff.toFixed(1)}%) 📈` : ` (${diff.toFixed(1)}%) 📉`;
            };

            const overallDelta = getDeltaStr(totalCoverage, baseTotal);
            const overallIcon = totalCoverage >= 80 ? '🟢' : totalCoverage >= 60 ? '🟡' : '🔴';

            let body = `## 🤖 FancyBot: Code Coverage Report\n\n`;
            body += `**Overall Coverage: ${totalCoverage.toFixed(1)}%${overallDelta}**\n\n`;
            
            // Build per-target breakdown
            body += `### Module Coverage\n`;
            body += `| | Target | Coverage | Change |\n|--|--------|----------|--------|\n`;
            for (const target of report.targets || []) {
              if (target.name.includes('Tests')) continue;
              const pct = (target.lineCoverage * 100);
              
              let basePct = null;
              if (baseReport) {
                const baseTarget = (baseReport.targets || []).find(t => t.name === target.name);
                if (baseTarget) basePct = (baseTarget.lineCoverage * 100);
              }
              
              const icon = pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
              body += `| ${icon} | \`${target.name}\` | ${pct.toFixed(1)}% | ${getDeltaStr(pct, basePct)} |\n`;
            }

            // Build file-wise breakdown
            body += `\n<details><summary><strong>📄 File-wise Coverage</strong></summary>\n\n`;
            body += `| File | Coverage | Change |\n|------|----------|--------|\n`;
            for (const target of report.targets || []) {
              if (target.name.includes('Tests')) continue;
              
              let baseTarget = null;
              if (baseReport) {
                baseTarget = (baseReport.targets || []).find(t => t.name === target.name);
              }

              for (const file of target.files || []) {
                const pct = (file.lineCoverage * 100);
                let basePct = null;
                if (baseTarget) {
                  const baseFile = (baseTarget.files || []).find(f => f.name === file.name);
                  if (baseFile) basePct = (baseFile.lineCoverage * 100);
                }
                const icon = pct >= 80 ? '🟢' : pct >= 60 ? '🟡' : '🔴';
                body += `| ${icon} \`${file.name}\` | ${pct.toFixed(1)}% | ${getDeltaStr(pct, basePct)} |\n`;
              }
            }
            body += `</details>\n\n`;

            body += `> 🎯 Target threshold: **80%**\n`;
            body += `> 📊 Generated from \`TestResults.xcresult\``;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.body.includes('FancyBot: Code Coverage Report') && c.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
