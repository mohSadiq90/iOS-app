name: iOSApp
options:
  bundleIdPrefix: com.demo
targets:
  iOSApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/iOSApp]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
  iOSAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    dependencies:
      - target: iOSApp
    settings:
      GENERATE_INFOPLIST_FILE: YES

schemes:
  iOSApp:
    build:
      targets:
        iOSApp: all
        iOSAppTests: [test]
    test:
      targets:
        - iOSAppTests
      gatherCoverageData: true
